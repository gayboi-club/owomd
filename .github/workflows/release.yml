name: Release build

permissions:
  contents: write

on:
  push:
    tags:
      - 'v*' # Push events to matching v*, i.e. v1.0, v20.15.10

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
        
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build binary with PyInstaller
        run: |
          pyinstaller --onefile owomd.py

      - name: Rename output binaries for OS
        shell: bash
        run: |
          if [ "$RUNNER_OS" == "Linux" ]; then
            if [ "$(uname -m)" == "aarch64" ]; then
              mv dist/owomd dist/owomd-linux-arm64
            else
              mv dist/owomd dist/owomd-linux-amd64
            fi
          elif [ "$RUNNER_OS" == "macOS" ]; then
            mv dist/owomd dist/owomd-macos
          elif [ "$RUNNER_OS" == "Windows" ]; then
            mv dist/owomd.exe dist/owomd-windows.exe
          fi

      - name: Upload binaries to Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/owomd-*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
